name: MCP Continuous Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run health check every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  mcp-health-check:
    name: MCP Health Check
    runs-on: ubuntu-latest
    env:
      FRONTEND_BASE_URL: https://buywhere.ai
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run health check
      id: health_check
      run: |
        HEALTH_URL="${FRONTEND_BASE_URL%/}/health"
        ROOT_URL="${FRONTEND_BASE_URL%/}/"
        HEALTH_HTTP=$(curl -fsSL -o /tmp/frontend-health.json -w "%{http_code}" "$HEALTH_URL")
        ROOT_HTTP=$(curl -fsSL -o /tmp/frontend-home.html -w "%{http_code}" "$ROOT_URL")
        if grep -q "BuyWhere" /tmp/frontend-home.html && [ "$HEALTH_HTTP" = "200" ] && [ "$ROOT_HTTP" = "200" ]; then
          STATUS=healthy
          ERRORS='[]'
        else
          STATUS=unhealthy
          ERRORS='["Frontend homepage or health endpoint failed validation"]'
        fi
        STATUS="$STATUS" ERRORS="$ERRORS" HEALTH_HTTP="$HEALTH_HTTP" ROOT_HTTP="$ROOT_HTTP" node - <<'NODE'
        const fs = require('fs');
        const status = process.env.STATUS;
        const errors = JSON.parse(process.env.ERRORS);
        const report = {
          timestamp: new Date().toISOString(),
          overallStatus: status,
          errors,
          warnings: [],
          endpoints: {
            health: { status, responseTime: 0, statusCode: Number(process.env.HEALTH_HTTP || 0) },
            homepage: { status, responseTime: 0, statusCode: Number(process.env.ROOT_HTTP || 0) },
          },
        };
        fs.writeFileSync('health-check-report.json', JSON.stringify(report, null, 2));
        NODE
        test "$STATUS" = "healthy"
      
    - name: Upload health check report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: health-check-report
        path: health-check-report.json
        
    - name: Comment on PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = 'health-check-report.json';
          
          if (fs.existsSync(path)) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            let comment = `## MCP Health Check Results\n\n`;
            comment += `**Status:** ${report.overallStatus.toUpperCase()}\n`;
            comment += `**Timestamp:** ${new Date(report.timestamp).toLocaleString()}\n\n`;
            
            comment += `### Endpoints Tested: ${Object.keys(report.endpoints).length}\n`;
            comment += `### Errors: ${report.errors.length}\n`;
            comment += `### Warnings: ${report.warnings.length}\n\n`;
            
            if (report.errors.length > 0) {
              comment += `❌ **Errors:**\n`;
              report.errors.forEach(error => {
                comment += `- ${error}\n`;
              });
              comment += '\n';
            }
            
            if (report.warnings.length > 0) {
              comment += `⚠️ **Warnings:**\n`;
              report.warnings.forEach(warning => {
                comment += `- ${warning}\n`;
              });
              comment += '\n';
            }
            
            comment += `### Endpoints Status:\n`;
            Object.entries(report.endpoints).forEach(([name, endpoint]) => {
              const status = endpoint.status === 'healthy' ? '✅' : 
                           endpoint.status === 'slow' ? '⚠️' : '❌';
              comment += `${status} ${name}: ${endpoint.status} (${endpoint.responseTime}ms)\n`;
            });
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
          
    - name: Send Slack alert on failure
      if: failure() || (github.event_name == 'schedule' && steps.health_check.outcome == 'failure')
      uses: rtCamp/action-slack@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        status: failure
        fields: repo,message,commit,author,action,eventName,ref,workflow
        text: '🚨 MCP Health Check failed in workflow ${{ github.workflow }}'
        
  mcp-continuous-monitor:
    name: MCP Continuous Monitor
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    env:
      FRONTEND_BASE_URL: https://buywhere.ai
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run daemon mode
      run: |
        HEALTH_URL="${FRONTEND_BASE_URL%/}/health"
        for i in 1 2 3; do
          curl -fsS "$HEALTH_URL" >/dev/null
          sleep 5
        done
        
    - name: Generate summary report
      run: |
        HEALTH_URL="${FRONTEND_BASE_URL%/}/health"
        ROOT_URL="${FRONTEND_BASE_URL%/}/"
        HEALTH_HTTP=$(curl -fsSL -o /tmp/frontend-health.json -w "%{http_code}" "$HEALTH_URL")
        ROOT_HTTP=$(curl -fsSL -o /tmp/frontend-home.html -w "%{http_code}" "$ROOT_URL")
        if grep -q "BuyWhere" /tmp/frontend-home.html && [ "$HEALTH_HTTP" = "200" ] && [ "$ROOT_HTTP" = "200" ]; then
          STATUS=healthy
          ERRORS='[]'
        else
          STATUS=unhealthy
          ERRORS='["Frontend homepage or health endpoint failed validation"]'
        fi
        STATUS="$STATUS" ERRORS="$ERRORS" HEALTH_HTTP="$HEALTH_HTTP" ROOT_HTTP="$ROOT_HTTP" node - <<'NODE'
        const fs = require('fs');
        const status = process.env.STATUS;
        const errors = JSON.parse(process.env.ERRORS);
        const report = {
          timestamp: new Date().toISOString(),
          overallStatus: status,
          errors,
          warnings: [],
          endpoints: {
            health: { status, responseTime: 0, statusCode: Number(process.env.HEALTH_HTTP || 0) },
            homepage: { status, responseTime: 0, statusCode: Number(process.env.ROOT_HTTP || 0) },
          },
        };
        fs.writeFileSync('health-check-report.json', JSON.stringify(report, null, 2));
        NODE
        echo "Generated health check report for continuous monitoring"
