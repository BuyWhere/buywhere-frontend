name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'buywhere-frontend-server.js'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: buywhere-site-production

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE="us-central1-docker.pkg.dev/buywhere-site-production/buywhere-frontend/buywhere-frontend:$(date +%s)"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          gcloud builds submit \
            --project=buywhere-site-production \
            --tag="$IMAGE" \
            --timeout=600s

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy buywhere-site-production \
            --project=buywhere-site-production \
            --image="$IMAGE" \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80 \
            --timeout=300s \
            --set-env-vars="NODE_ENV=production"

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe buywhere-site-production \
            --project=buywhere-site-production \
            --region=us-central1 \
            --format='value(status.url)')
          echo "Service URL: $URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "Health check: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check FAILED"
            exit 1
          fi
          curl -s "$URL" | grep -q "BuyWhere" && echo "Content check PASSED" || { echo "Content check FAILED"; exit 1; }
